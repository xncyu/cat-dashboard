<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貓咪相簿牆</title>
    <style>
        body { background-color: #F5E6D3; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; color: #5D4037; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 600px; }
        .polaroid { background: white; padding: 10px 10px 20px 10px; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transform: rotate(-2deg); transition: transform 0.2s; }
        .polaroid:nth-child(even) { transform: rotate(2deg); }
        .polaroid:hover, .polaroid:active { transform: scale(1.05) rotate(0deg); z-index: 10; }
        .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 3px; background-color: #E0C9B1; }
        .caption { text-align: center; font-size: 0.9rem; margin-top: 10px; font-weight: bold; color: #8D6E63; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #FFFFFF; box-shadow: 0 -2px 10px rgba(139, 115, 85, 0.1); display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { text-decoration: none; color: #D7CCC8; font-weight: bold; display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; width: 33%; }
        .nav-item.active { color: #5D4037; }
        .nav-emoji { font-size: 1.5rem; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>📷 主子相簿牆</h1>
    
    <div class="gallery-grid">
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&q=80" alt="貓咪照片">
            <div class="caption">最愛睡覺</div>
        </div>
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=400&q=80" alt="貓咪照片">
            <div class="caption">無辜大眼</div>
        </div>
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400&q=80" alt="貓咪照片">
            <div class="caption">準備搗蛋</div>
        </div>
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=400&q=80" alt="貓咪照片">
            <div class="caption">完美伸展</div>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><div class="nav-emoji">🏠</div>首頁</a>
        <a href="health.html" class="nav-item"><div class="nav-emoji">🩺</div>健康備忘錄</a>
        <a href="gallery.html" class="nav-item active"><div class="nav-emoji">📷</div>相簿牆</a>
    </div>
</body>
</html>
