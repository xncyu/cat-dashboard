<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貓咪健康備忘錄</title>
    <style>
        body { background-color: #F5E6D3; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; color: #5D4037; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
        .input-area { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; border-radius: 10px; border: 2px solid #E0C9B1; padding: 10px; font-size: 1rem; box-sizing: border-box; font-family: inherit; }
        .save-btn { background-color: #A1887F; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .note-board { background-color: rgba(255, 255, 255, 0.8); border-radius: 15px; width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; flex-grow: 1; overflow-y: auto; }
        .note-item { background-color: #FFF; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .note-date { color: #8D6E63; font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; }
        .delete-btn { color: #FFB09C; font-size: 0.85rem; float: right; cursor: pointer; border: none; background: none; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #FFFFFF; box-shadow: 0 -2px 10px rgba(139, 115, 85, 0.1); display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { text-decoration: none; color: #D7CCC8; font-weight: bold; display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; width: 33%; }
        .nav-item.active { color: #5D4037; }
        .nav-emoji { font-size: 1.5rem; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>🩺 健康備忘錄</h1>
    
    <div class="input-area">
        <textarea id="noteInput" placeholder="例如：發現下巴有黑黑的粉刺，改用陶瓷碗裝水並觀察..."></textarea>
        <button class="save-btn" onclick="saveNote()">儲存紀錄</button>
    </div>

    <div class="note-board" id="note-list">
        <!-- 備忘錄會顯示在這裡 -->
    </div>

    <!-- 底部導覽列 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><div class="nav-emoji">🏠</div>首頁</a>
        <a href="health.html" class="nav-item active"><div class="nav-emoji">🩺</div>健康備忘錄</a>
        <a href="gallery.html" class="nav-item"><div class="nav-emoji">📷</div>相簿牆</a>
    </div>

    <script>
        window.onload = renderNotes;
        function saveNote() {
            const input = document.getElementById('noteInput');
            if(input.value.trim() === '') return;
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
            let notes = JSON.parse(localStorage.getItem('catNotes')) || [];
            notes.unshift({ date: dateStr, text: input.value });
            localStorage.setItem('catNotes', JSON.stringify(notes));
            input.value = '';
            renderNotes();
        }
        function deleteNote(index) {
            let notes = JSON.parse(localStorage.getItem('catNotes')) || [];
            notes.splice(index, 1);
            localStorage.setItem('catNotes', JSON.stringify(notes));
            renderNotes();
        }
        function renderNotes() {
            let notes = JSON.parse(localStorage.getItem('catNotes')) || [];
            const list = document.getElementById('note-list');
            if(notes.length === 0) { list.innerHTML = '<div style="color: #A1887F; text-align: center;">目前沒有健康紀錄</div>'; return; }
            list.innerHTML = notes.map((note, idx) => `
                <div class="note-item">
                    <div class="note-date">${note.date} <button class="delete-btn" onclick="deleteNote(${idx})">刪除</button></div>
                    <div>${note.text}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
