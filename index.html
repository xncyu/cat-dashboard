<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貓咪日常打卡</title>
    <style>
        body {
            background-color: #F5E6D3;
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* 留空間給底部選單 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #5D4037;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
        .btn-container {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 600px;
        }
        .action-btn {
            background-color: #FFFFFF; border: 2px solid #E0C9B1; border-radius: 20px; padding: 20px 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 6px 15px rgba(139, 115, 85, 0.15); transition: all 0.1s ease; user-select: none;
        }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 5px rgba(139, 115, 85, 0.15); }
        .emoji { font-size: 2.5rem; margin-bottom: 8px; }
        .btn-text { font-size: 1.05rem; font-weight: bold; }
        .record-board {
            margin-top: 30px; background-color: rgba(255, 255, 255, 0.6); border-radius: 15px;
            width: 100%; max-width: 600px; flex-grow: 1; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .record-title {
            font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; border-bottom: 2px dashed #E0C9B1;
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .record-item { font-size: 1.1rem; margin-bottom: 12px; }
        .time-tag { color: #A1887F; font-size: 0.9rem; margin-right: 10px; }
        .clear-btn { background-color: #FFB09C; color: white; border: none; border-radius: 8px; padding: 5px 10px; font-weight: bold; }
        
        /* 底部導覽列 CSS */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #FFFFFF;
            box-shadow: 0 -2px 10px rgba(139, 115, 85, 0.1); display: flex; justify-content: space-around;
            padding: 15px 0; z-index: 1000; padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .nav-item {
            text-decoration: none; color: #D7CCC8; font-weight: bold; display: flex;
            flex-direction: column; align-items: center; font-size: 0.9rem; width: 33%;
        }
        .nav-item.active { color: #5D4037; }
        .nav-emoji { font-size: 1.5rem; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>🐈 首頁：日常打卡</h1>
    <div class="btn-container">
        <div class="action-btn" onclick="addRecord('餵罐罐', '🐟')"><div class="emoji">🐟</div><div class="btn-text">餵罐罐</div></div>
        <div class="action-btn" onclick="addRecord('清貓砂', '🚽')"><div class="emoji">🚽</div><div class="btn-text">清貓砂</div></div>
        <div class="action-btn" onclick="addRecord('換乾淨水', '💧')"><div class="emoji">💧</div><div class="btn-text">換乾淨水</div></div>
        <div class="action-btn" onclick="addRecord('陪玩放電', '🧶')"><div class="emoji">🧶</div><div class="btn-text">陪玩放電</div></div>
        <div class="action-btn" onclick="addRecord('點驅蟲藥', '🛡️')"><div class="emoji">🛡️</div><div class="btn-text">點驅蟲藥</div></div>
        <div class="action-btn" onclick="addRecord('剪指甲', '✂️')"><div class="emoji">✂️</div><div class="btn-text">剪指甲</div></div>
    </div>
    <div class="record-board">
        <div class="record-title">今日打卡紀錄<button class="clear-btn" onclick="clearRecords()">清除重置</button></div>
        <div id="record-list"></div>
    </div>

    <!-- 底部導覽列 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><div class="nav-emoji">🏠</div>首頁</a>
        <a href="health.html" class="nav-item"><div class="nav-emoji">🩺</div>健康備忘錄</a>
        <a href="gallery.html" class="nav-item"><div class="nav-emoji">📷</div>相簿牆</a>
    </div>

    <script>
        const recordList = document.getElementById('record-list');
        window.onload = function() { loadRecords(); };
        function addRecord(action, emoji) {
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const recordText = `<span class="time-tag">[${timeString}]</span> 完成了 <b>${action}</b> ${emoji}`;
            let records = JSON.parse(localStorage.getItem('catRecords')) || [];
            records.unshift(recordText);
            localStorage.setItem('catRecords', JSON.stringify(records));
            renderRecords();
        }
        function renderRecords() {
            let records = JSON.parse(localStorage.getItem('catRecords')) || [];
            if (records.length === 0) {
                recordList.innerHTML = '<div style="color: #A1887F; text-align: center; margin-top: 20px;">今天還沒有打卡喔！</div>'; return;
            }
            recordList.innerHTML = records.map(record => `<div class="record-item">${record}</div>`).join('');
        }
        function loadRecords() { renderRecords(); }
        function clearRecords() {
            if(confirm("確定要清除今天的紀錄嗎？")) { localStorage.removeItem('catRecords'); renderRecords(); }
        }
    </script>
</body>
</html>
